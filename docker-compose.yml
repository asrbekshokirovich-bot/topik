services:
  db:
    image: postgres:16
    container_name: topik_station_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: topik_station
    ports:
      - "5432:5432"
    volumes:
      - topik_station_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d topik_station"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  topik_station_data:
